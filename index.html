<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dot Tutor | Coming Soon</title>
    <meta
      name="description"
      content="Dot Tutor is launching soon. Stay tuned for a smarter learning experience."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-orb orb-yellow" aria-hidden="true"></div>
    <div class="background-orb orb-green" aria-hidden="true"></div>

    <main class="page">
      <section class="coming-soon" aria-label="Coming soon announcement">
        <img
          src="dot.logos10.png"
          alt="Dot Tutor logo"
          class="logo"
          width="320"
          height="245"
        />

        <p class="tag">A fresh learning experience is on the way</p>
        <h1>Coming Soon</h1>
        <p class="description">
          We are building something thoughtful, simple, and effective for learners.
          Dot Tutor will be live soon.
        </p>

        <form class="notify-form" action="#" method="post">
          <label for="email" class="sr-only">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
          />
          <button type="submit">Notify Me</button>
        </form>
      </section>
    </main>
  </body>
</html>
